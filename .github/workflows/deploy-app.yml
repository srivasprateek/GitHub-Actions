name: Deploy Flask App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker-compose pull
          docker-compose up -d
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}