name: CICD

on:
  workflow_dispatch:

jobs:

  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "clone code from github"

  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: build the container
        run: echo "docker container build"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: test the container
        run: echo "testing the container"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: deploy the app
        run: echo "docker compose deployed the app"
